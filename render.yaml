services:
  - type: web
    name: rawda-api
    env: node
    buildCommand: "npm install -g pnpm@9 && pnpm install --no-lockfile && cd artifacts/api-server && node ./build.mjs"
    startCommand: "node --enable-source-maps artifacts/api-server/dist/index.mjs"
    envVars:
      - key: NODE_ENV
        value: production

  - type: static
    name: rawda
    buildCommand: "npm install -g pnpm@9 && pnpm install --no-lockfile && cd artifacts/crm-app && pnpm run build"
    staticPublishPath: artifacts/crm-app/dist/public
    envVars:
      - key: BASE_PATH
        value: /
